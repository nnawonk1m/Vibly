<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibly BLE Logger</title>
<!--
  ============================================================================
  Vibly BLE logger  -  matched to vibly_localised_haptics0.ino
  ============================================================================

  WHY THE PREVIOUS VERSION FOUND NOTHING

  It searched for a device named "XIAO-ESP32S3" offering service
  12345678-...-001. Those identifiers belong to ble_adv.ino. The Vibly
  firmware advertises the name "Vibly" and service 780bf242-..., so the
  browser's scan matched nothing and the picker stayed empty. All three
  identifiers below now match the firmware.

  It also filters on the SERVICE rather than the device name. A name filter
  breaks the moment the device is renamed; the service UUID is what actually
  identifies this application, and the firmware puts it in the advertising
  packet where the browser can see it.

  THE OTHER FIX: LINE REASSEMBLY

  The firmware splits a status line across several notifications when the
  negotiated MTU is small, and marks the end of each line with '\n'. Treating
  one notification as one line - which the previous version did - chops lines
  into fragments and prints them on separate rows. Bytes are buffered here and
  split on newline instead, so a line arrives whole regardless of how many
  packets carried it.

  REQUIREMENTS
    * Chrome or Edge on desktop, or Chrome on Android.
      Safari does NOT support Web Bluetooth, on any platform, including iOS.
    * macOS: allow Bluetooth for Chrome in
      System Settings > Privacy & Security > Bluetooth.
  ============================================================================
-->
<style>
:root{
  --sky:#e9f2fb; --sky2:#dbe9f8; --card:#fff; --edge:#cbdef3; --pale:#f3f8ff;
  --ink:#12314f; --mute:#5f7f9e; --blue:#4a7fc1; --deep:#2c5c98;
  --good:#3f8f6a; --bad:#cf7a72; --warn:#a8721f;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  --ui:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;color:var(--ink);
  font:16px/1.55 var(--ui); -webkit-font-smoothing:antialiased;
  background:linear-gradient(175deg,var(--sky),var(--sky2));background-attachment:fixed}

/* Full-bleed column: header and controls take what they need, the log takes
   everything that is left. No max-width, because a 234-character log line is
   the widest thing here and every pixel of screen buys back font size. */
.container{display:flex;flex-direction:column;height:100%;padding:12px 14px 12px;gap:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
h1{font:700 24px/1 var(--ui);margin:0;color:var(--deep);letter-spacing:-.01em}
h1 span{font-weight:400;color:var(--mute);font-size:15px;margin-left:9px}
#pill{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--edge);border-radius:999px;padding:6px 13px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
#dot.ok{background:var(--good)} #dot.bad{background:var(--bad)}
.lbl{font:600 11px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  padding:12px 14px;box-shadow:0 1px 2px rgba(28,72,120,.05);flex:none}
.card.grow{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#notice{display:none;border-radius:11px;padding:12px 15px;font-size:14px;flex:none}
#notice.show{display:block}
#notice.err{background:#fdecea;border:1px solid #f0c2bd;color:#8a3a33}
#notice.warn{background:#fdf5e6;border:1px solid #ecd9ae;color:#7a5716}
.buttons{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none}
button{font:600 13px/1.2 var(--ui);padding:12px 16px;border-radius:9px;cursor:pointer;
  background:var(--card);color:var(--deep);border:1px solid var(--edge);
  transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:var(--sky);border-color:var(--blue)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover:not(:disabled){background:var(--deep);border-color:var(--deep)}
button.rec[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{font:600 10px/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;
  padding:7px 11px;border-radius:999px;border:1px solid var(--edge);
  background:var(--pale);color:var(--mute);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.conhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px;flex:none}
/* overflow-x hidden, not auto: the font size is computed to fit, so a
   horizontal scrollbar would mean the fitting failed rather than being a
   useful affordance. */
#log{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  background:var(--pale);border:1px solid var(--edge);
  border-radius:10px;padding:8px 10px;white-space:pre;
  font-family:var(--mono);font-size:13px;line-height:1.55;
  font-variant-numeric:tabular-nums;overscroll-behavior:contain}
#log.wrap{white-space:pre-wrap;word-break:break-word}
#log div{padding:1px 0}
#log .ev{color:var(--deep);font-weight:700;background:#e3effc;margin:4px -12px;
  padding:4px 12px;border-left:3px solid var(--blue);white-space:pre-wrap}
#log .sys{color:var(--warn);white-space:pre-wrap}
#log .rec{color:var(--bad);font-weight:700;white-space:pre-wrap}
.empty{color:var(--mute);font:14px var(--ui);margin:0;white-space:normal}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;flex:none;
  padding:10px 14px;font-size:14px}
.stats b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys button{flex:1 1 110px}
#fit{margin-left:auto;font:600 11px var(--mono);color:var(--mute)}
</style>
</head>
<body>
<div class="container">

<header>
  <h1>Vibly<span>BLE logger</span></h1>
  <span id="pill"><i id="dot"></i><span class="lbl" id="state">Disconnected</span></span>
</header>

<div id="notice"></div>

<div class="buttons">
  <button id="connect" class="primary">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <button id="record" class="rec" aria-pressed="false" disabled>Start recording</button>
  <button id="download" disabled>Download .txt</button>
  <button id="clear">Clear</button>
  <button id="full">Full screen</button>
</div>

<div class="card">
  <span class="lbl" style="display:block;margin-bottom:10px">device controls</span>
  <div class="keys">
    <button data-w="a" disabled>Auto</button>
    <button data-w="1" disabled>Speech</button>
    <button data-w="2" disabled>Car horn</button>
    <button data-w="3" disabled>Baby cry</button>
    <button data-w="0" disabled>Stop</button>
  </div>
</div>

<div class="card grow">
  <div class="conhead">
    <span class="lbl">log</span>
    <div class="chips">
      <button class="chip" id="cAuto" aria-pressed="true">Auto-reconnect</button>
      <button class="chip" id="cFit" aria-pressed="true">Fit width</button>
      <button class="chip" id="cDate" aria-pressed="false">Show date</button>
      <button class="chip" id="cFollow" aria-pressed="true">Follow</button>
      <button class="chip" id="cEvents" aria-pressed="false">Events only</button>
    </div>
    <span id="fit"></span>
  </div>
  <div id="log"><p class="empty" id="empty">Not connected. Press Connect and choose “Vibly” from the browser’s device list.</p></div>
</div>

<div class="card stats">
  <span class="lbl">device <b id="dev">—</b></span>
  <span class="lbl">lines <b id="count">0</b></span>
  <span class="lbl">rate <b id="rate">0.0</b> /s</span>
  <span class="lbl">recorded <b id="recCount">0</b></span>
  <span class="lbl">link up <b id="uptime">0s</b></span>
  <span class="lbl">drops <b id="sessions">0</b></span>
</div>

</div>

<script>
/* Must match vibly_localised_haptics0.ino exactly. */
const SERVICE_UUID        = "780bf242-ff64-47f4-9627-cc76108e2a27";
const CHARACTERISTIC_UUID = "38ff9161-1378-4414-a3c2-cb5ffc17ff92";

const $ = id => document.getElementById(id);

let device = null, characteristic = null;
let recording = false, logData = "";
let rxBuf = "", follow = true, eventsOnly = false;
let fitWidth = true, showDate = false, maxChars = 0, fitPending = false;
let autoReconnect = true, retryTimer = null, retries = 0;
const sessions = [];
const FIT_MIN = 7, FIT_MAX = 15;
let count = 0, recCount = 0, stamps = [];

/* Fit the longest line to the available width.
 *
 * The log is monospaced, so width is exactly (characters x advance width), and
 * advance width scales linearly with font-size. Measuring a probe once per fit
 * gives the ratio for whatever font the platform actually resolved from the
 * stack — hard-coding 0.6em would be wrong on any platform that picked a
 * different face.
 *
 * Below FIT_MIN the text stops being readable, so rather than shrinking
 * further the log switches to wrapping. Lines then take two rows, which is a
 * worse read but still better than a horizontal scrollbar. */
function fitLog(){
  const box = $("log");
  if(!box || !maxChars) return;

  if(!fitWidth){
    box.style.fontSize = "13px";
    box.classList.remove("wrap");
    $("fit").textContent = "";
    return;
  }

  const probe = document.createElement("span");
  probe.style.position   = "absolute";
  probe.style.visibility = "hidden";
  probe.style.whiteSpace = "pre";
  probe.style.fontFamily = getComputedStyle(box).fontFamily;
  probe.style.fontSize   = "100px";
  probe.textContent = "0".repeat(50);
  document.body.appendChild(probe);
  const perCharAt100 = probe.getBoundingClientRect().width / 50;
  probe.remove();
  if(!perCharAt100) return;

  const style = getComputedStyle(box);
  const avail = box.clientWidth
              - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
              - 14;                                   /* scrollbar allowance */

  let size = Math.floor(avail / (maxChars * perCharAt100 / 100) * 10) / 10;
  const wrapped = size < FIT_MIN;
  size = Math.max(FIT_MIN, Math.min(FIT_MAX, size));

  box.style.fontSize = size + "px";
  box.classList.toggle("wrap", wrapped);
  $("fit").textContent = maxChars + " cols \u00b7 " + size.toFixed(1) + "px"
                       + (wrapped ? " \u00b7 wrapping" : "");
}

function scheduleFit(){
  if(fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; fitLog(); });
}

addEventListener("resize", scheduleFit);

function notice(kind, msg){
  const n = $("notice");
  if(!kind){ n.className = ""; return; }
  n.className = "show " + kind;
  n.textContent = msg;
}

function setState(txt, cls){
  $("state").textContent = txt;
  $("dot").className = cls || "";
}

const pad = (v,n=2) => String(v).padStart(n,"0");

function tsFull(d){
  d = d || new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+tsTime(d);
}
function tsTime(d){
  d = d || new Date();
  return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+"."+
         pad(d.getMilliseconds(),3);
}
/* Screen and file deliberately differ. The date is 11 characters that repeat
   identically on every row, which at these widths costs about a point of font
   size — it belongs in the exported file, where it is written once in the
   header and again per line for archival, not on a screen where every
   character competes with legibility. */
function ts(){ return showDate ? tsFull() : tsTime(); }

function addLog(text, kind){
  const line = "[" + ts() + "] " + text;

  /* Recording captures everything, regardless of the view filter, and always
     with the full date — the filter is for reading, not for deciding what is
     worth keeping. */
  if(recording){
    logData += "[" + tsFull() + "] " + text + "\n";
    recCount++; $("recCount").textContent = recCount;
  }

  if(!kind && text.startsWith(">>>")) kind = "ev";
  if(!kind && text.startsWith("[!]")) kind = "sys";
  if(eventsOnly && !kind) return;

  const e = $("empty"); if(e) e.remove();
  const box = $("log");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const div = document.createElement("div");
  if(kind) div.className = kind;
  div.textContent = line;
  box.appendChild(div);
  if(line.length > maxChars){ maxChars = line.length; scheduleFit(); }
  while(box.children.length > 800) box.removeChild(box.firstChild);
  if(follow && atBottom) box.scrollTop = box.scrollHeight;
}

/* Reassemble lines from the byte stream.
   The firmware ends every line with '\n' and may split one line across
   several notifications, so notifications are NOT message boundaries. */
function handleNotification(event){
  rxBuf += new TextDecoder("utf-8").decode(event.target.value);

  let i;
  while((i = rxBuf.indexOf("\n")) >= 0){
    const line = rxBuf.slice(0, i).replace(/\r$/, "");
    rxBuf = rxBuf.slice(i + 1);
    if(line.length){
      addLog(line);
      count++; $("count").textContent = count;
      stamps.push(Date.now());
    }
  }
  /* If a newline never arrives, don't grow forever. */
  if(rxBuf.length > 8192) rxBuf = "";
}

let connectedAt = 0;
setInterval(() => {
  $("uptime").textContent = connectedAt
    ? Math.floor((Date.now() - connectedAt) / 1000) + "s" : "0s";
  const cut = Date.now() - 5000;
  stamps = stamps.filter(t => t > cut);
  $("rate").textContent = (stamps.length / 5).toFixed(1);
}, 500);

function setConnected(on){
  $("connect").disabled    = on;
  $("disconnect").disabled = !on;
  $("record").disabled     = !on;
  document.querySelectorAll("button[data-w]").forEach(b => b.disabled = !on);
}

async function connectBLE(){
  if(!navigator.bluetooth){
    notice("err", "This browser has no Web Bluetooth. Use Chrome or Edge on desktop, "+
                  "or Chrome on Android. Safari does not support it on any platform, "+
                  "including iOS.");
    return;
  }
  if(!window.isSecureContext){
    notice("err", "Web Bluetooth needs a secure context. Open this file directly "+
                  "(file://) or serve it over https:// — not plain http://.");
    return;
  }

  try{
    notice(null);
    setState("Searching…");

    /* Filter on the SERVICE, not the name: the service is what identifies
       this application, and it survives renaming the device. */
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected", onDisconnected);
    setState("Connecting…");

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

    await characteristic.startNotifications();
    characteristic.addEventListener("characteristicvaluechanged", handleNotification);

    rxBuf = ""; retries = 0;
    $("dev").textContent = device.name || "(unnamed)";
    connectedAt = Date.now();
    setState("Connected", "ok");
    setConnected(true);
    addLog(">>> CONNECTED to " + (device.name || "device"), "ev");

  }catch(err){
    console.error(err);
    setState("Failed", "bad");
    if(err && err.name === "NotFoundError"){
      notice("warn", "No device chosen, or none advertising service "+SERVICE_UUID+
                     ". Check the board is powered and the Serial Monitor shows "+
                     "\"Advertising as Vibly\". If a phone or another tab is already "+
                     "connected, the board will not appear — only one central at a time.");
    }else{
      notice("err", "Connection failed: " + (err && err.message ? err.message : err));
    }
  }
}

function onDisconnected(){
  setState("Disconnected", "bad");
  setConnected(false);
  characteristic = null;
  const secs = connectedAt ? Math.round((Date.now() - connectedAt) / 100) / 10 : 0;
  sessions.push(secs);
  const avg = (sessions.reduce((a, b) => a + b, 0) / sessions.length).toFixed(1);
  addLog(">>> DISCONNECTED after " + secs + "s  (session " + sessions.length +
         ", average " + avg + "s)", "rec");
  $("sessions").textContent = sessions.length + " / avg " + avg + "s";
  connectedAt = 0;
  if(autoReconnect && device) scheduleRetry();
}

/* Reconnecting reuses the existing device object, so the browser does NOT
   show the picker again — no click needed. Backs off 1, 2, 4, 8 s up to 10 s
   so a board that is genuinely off does not get hammered. */
function scheduleRetry(){
  clearTimeout(retryTimer);
  const wait = Math.min(10000, 1000 * Math.pow(2, retries));
  retries++;
  addLog(">>> reconnecting in " + (wait / 1000) + "s (attempt " + retries + ")", "rec");
  retryTimer = setTimeout(reattach, wait);
}

async function reattach(){
  if(!device || !autoReconnect) return;
  try{
    setState("Reconnecting\u2026");
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
    await characteristic.startNotifications();
    characteristic.addEventListener("characteristicvaluechanged", handleNotification);
    rxBuf = ""; retries = 0;
    connectedAt = Date.now();
    setState("Connected", "ok");
    setConnected(true);
    addLog(">>> RECONNECTED", "ev");
  }catch(err){
    if(autoReconnect) scheduleRetry();
  }
}

async function writeCmd(v){
  if(!characteristic) return;
  try{
    await characteristic.writeValue(new TextEncoder().encode(v));
    addLog(">>> sent command \"" + v + "\"", "rec");
  }catch(err){
    notice("err", "Could not send command: " + (err && err.message ? err.message : err));
  }
}

$("connect").onclick    = connectBLE;
$("disconnect").onclick = () => {
  clearTimeout(retryTimer);
  autoReconnect = false; $("cAuto").setAttribute("aria-pressed", false);
  if(device && device.gatt.connected) device.gatt.disconnect();
};

$("record").onclick = function(){
  recording = !recording;
  this.setAttribute("aria-pressed", recording);
  this.textContent = recording ? "Stop recording" : "Start recording";
  if(recording){ logData = ""; recCount = 0; $("recCount").textContent = "0"; }
  $("download").disabled = recording || logData.length === 0;
  addLog(recording ? ">>> RECORDING STARTED" : ">>> RECORDING STOPPED", "rec");
};

$("download").onclick = function(){
  if(!logData.length){ notice("warn", "Nothing recorded yet. Press Start recording first."); return; }
  const header =
    "Vibly BLE session log\n" +
    "=====================\n" +
    "captured   : " + tsFull() + "\n" +
    "device     : " + ($("dev").textContent) + "\n" +
    "service    : " + SERVICE_UUID + "\n" +
    "lines      : " + recCount + "\n" +
    "---------------------------------------------------------------\n";
  const blob = new Blob([header + logData], { type: "text/plain" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = "vibly_log_" + tsFull().replace(/[: ]/g, "-") + ".txt";
  a.click();
  URL.revokeObjectURL(url);
};

$("clear").onclick = () => {
  $("log").innerHTML = "";
  count = 0; $("count").textContent = "0";
  maxChars = 0; fitLog();
};

$("cAuto").onclick = function(){
  autoReconnect = !autoReconnect;
  this.setAttribute("aria-pressed", autoReconnect);
  if(!autoReconnect) clearTimeout(retryTimer);
  else if(device && !device.gatt.connected){ retries = 0; reattach(); }
};
$("cFit").onclick = function(){
  fitWidth = !fitWidth; this.setAttribute("aria-pressed", fitWidth); fitLog();
};
$("cDate").onclick = function(){
  showDate = !showDate; this.setAttribute("aria-pressed", showDate);
  /* Existing rows keep the stamp they were written with; only the width
     budget changes, so re-measure from scratch. */
  maxChars = 0;
  document.querySelectorAll("#log div").forEach(d => {
    if(d.textContent.length > maxChars) maxChars = d.textContent.length;
  });
  fitLog();
};
$("full").onclick = function(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => {
  $("full").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
  scheduleFit();
});

$("cFollow").onclick = function(){ follow = !follow; this.setAttribute("aria-pressed", follow); };
$("cEvents").onclick = function(){ eventsOnly = !eventsOnly; this.setAttribute("aria-pressed", eventsOnly); };

document.querySelectorAll("button[data-w]").forEach(b =>
  b.onclick = () => writeCmd(b.dataset.w));

if(!navigator.bluetooth)
  notice("err", "This browser has no Web Bluetooth. Use Chrome or Edge on desktop, "+
                "or Chrome on Android. Safari does not support it on any platform.");
</script>
</body>
</html>
